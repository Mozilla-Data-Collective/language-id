repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 0.0.1a1
    hooks:
      - id: ty
        files: ^src/
        exclude: ^src/language_id/experiments/
