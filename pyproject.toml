[build-system]
requires = ["uv_build>=0.7.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "language-id"
version = "0.0.1"
description = "Benchmarking and building text language identification with CommonLID and CommonVoiceLID."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mozilla Data Collective" }]
license = { text = "MPL" }
keywords = ["language-identification", "lid", "nlp", "benchmark", "multilingual"]

dependencies = [
    # Core
    "datacollective>=0.5.1",
    "pandas>=2.2",
    "typer>=0.12",
    "langcodes>=3.4",
    "language-data>=1.4.0",
    # LLMs (Together SDK)
    "together>=1.3",
    # Standard LID tools
    "langdetect>=1.0.9",
    "fasttext-predict>=0.9.2",
    "huggingface-hub>=0.23",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pre-commit>=3.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
]

[project.scripts]
language-id = "language_id.cli:app"

[project.urls]
Homepage = "https://github.com/Mozilla-Data-Collective/language-id"
Documentation = "https://mozilla-data-collective.github.io/language-id/"

[tool.uv.build-backend]
module-name = "language_id"
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["docs", "results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF",
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
root = "src"
