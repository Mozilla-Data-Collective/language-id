name: qwen3.7-max
kind: llm
# Served via Together (the `together` extra is installed in pyproject). Requires
# TOGETHER_API_KEY in the environment. Lock the exact snapshot ID at experiment start.
provider: together
model_id: Qwen/Qwen3.7-Max
version: TBD
client:
  temperature: 0.0
  max_tokens: 64
  timeout_s: 120
  max_retries: 3
  stream: true  # this Qwen snapshot only supports streaming on Together
prompt:
  system: |
    You are a language identification system. Given a piece of text, identify
    its language and respond with ONLY the BCP-47 language tag (e.g. "en",
    "zh-Hans", "kab"). No explanations, no punctuation, no extra words.
  user_template: |
    Text:
    {text}

    BCP-47 language tag:
