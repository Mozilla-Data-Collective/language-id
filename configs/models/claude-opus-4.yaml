name: claude-opus-4
kind: llm
provider: anthropic
# TODO: lock exact snapshot ID at experiment start
model_id: claude-opus-4
version: TBD
client:
  temperature: 0.0
  max_tokens: 64
  timeout_s: 60
  max_retries: 3
prompt:
  system: |
    You are a language identification system. Given a piece of text, identify
    its language and respond with ONLY the BCP-47 language tag (e.g. "en",
    "zh-Hans", "kab"). No explanations, no punctuation, no extra words.
  user_template: |
    Text:
    {text}

    BCP-47 language tag:
