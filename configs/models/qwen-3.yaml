name: qwen-3-32b
kind: llm
# TODO: pick provider at experiment start. Options include `ollama` (local; requires
# the `any-llm-sdk[ollama]` extra, not currently installed) or a hosted endpoint such
# as Together / DeepInfra via the `openai`-compatible API. Lock the snapshot ID too.
provider: TBD
model_id: qwen3:32b
version: TBD
client:
  temperature: 0.0
  max_tokens: 64
  timeout_s: 120
  max_retries: 3
prompt:
  system: |
    You are a language identification system. Given a piece of text, identify
    its language and respond with ONLY the BCP-47 language tag (e.g. "en",
    "zh-Hans", "kab"). No explanations, no punctuation, no extra words.
  user_template: |
    Text:
    {text}

    BCP-47 language tag:
