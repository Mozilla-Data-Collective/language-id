experiment: exp1_offshelf_eval
description: Off-the-shelf evaluation of frontier LLMs and classical baselines on CommonLID.
dataset: commonlid
split: test          # CommonLID is evaluation-only (spec §2.1)
models:
  - gpt-5
  - claude-opus-4
  - qwen-3
  - mistral-large
  - langdetect
  - glotlid
  - nllb-lid

sampling:
  length_buckets:
    short:  [25, 35]
    medium: [35, 50]
    long:   [50, 100]
  per_language:
    short:  100
    medium: 100
    long:   100
  insufficient_data: include_what_exists
  overrides: {}
  seed: 42

wandb:
  project: lid-bench-exp1
