experiment: exp1_offshelf_eval
description: Off-the-shelf evaluation of frontier LLMs and standard baselines on CommonLID.
dataset: commonlid
split: test
models:
  - deepseek-v4-pro
  - gpt-oss-120b
  - qwen3.7-max
  - gpt-oss-20b  # (low-resource)
  - gemma-4-31b-fp8  # (low-resource)
  - langdetect
  - glotlid
  - nllb-lid

sampling:
  length_buckets:
    short:  [25, 35]
    medium: [35, 50]
    long:   [50, 100]
  per_language:
    short:  100
    medium: 100
    long:   100
  insufficient_data: include_what_exists
  overrides: {}
  seed: 42

wandb:
  project: lid-bench-exp1
