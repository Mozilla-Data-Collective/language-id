experiment: exp2_train_classifiers
description: Train LogReg, NGram-NB, and XLM-R LoRA on CommonVoiceLID train, tune on dev slice.
dataset: commonvoice_lid
splits:
  train: train
  dev: dev
  test: test

models:
  - logreg
  - ngram_nb
  - xlmr

# Held-out slice of dev used for hyperparameter tuning (spec §3 Experiment 2).
dev_holdout:
  fraction: 0.25
  seed: 42

wandb:
  project: lid-bench-exp2
