site_name: language-id
site_description: Benchmarking and building text language identification
site_url: https://mozilla-data-collective.github.io/language-id/
repo_url: https://github.com/Mozilla-Data-Collective/language-id
repo_name: Mozilla-Data-Collective/language-id
edit_uri: edit/main/docs/

theme:
  icon:
    repo: fontawesome/brands/github
  name: material
  palette:
    - scheme: default
      primary: black
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  logo: docs/mdc_logo.png
  favicon: docs/mdc_ccc.png
  extra_css:
    - assets/custom.css
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI reference: cli.md
  - Notebooks: notebooks.md
  - Datasets: datasets.md
  - Bring your own dataset: bring-your-own-dataset.md
  - Models: models.md

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        options:
          show_root_heading: true
